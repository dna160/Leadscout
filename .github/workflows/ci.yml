name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  engine:
    name: Engine
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: leadscout
          POSTGRES_PASSWORD: leadscout
          POSTGRES_DB: leadscout
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://leadscout:leadscout@localhost:5432/leadscout
      APIFY_MOCK: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check engine
        run: pnpm --filter @leadscout/engine typecheck

      - name: Unit tests
        run: pnpm --filter @leadscout/engine test

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check dashboard
        run: pnpm --filter @leadscout/dashboard typecheck

      - name: Build dashboard
        run: pnpm --filter @leadscout/dashboard build
        env:
          NEXT_PUBLIC_ENGINE_URL: http://localhost:4000
